[project]
name = "helperbot"
version = "0.1.0"
description = "Telegram bot for collecting team process improvements"
requires-python = ">=3.12"
dependencies = [
  "python-telegram-bot>=22.8,<23",
  "SQLAlchemy[asyncio]>=2.0.40,<2.2",
  "psycopg[binary]>=3.2,<4",
  "python-dotenv>=1.1,<2",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "aiosqlite>=0.21,<1"]

[project.scripts]
helperbot = "helperbot.main:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["helperbot*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
